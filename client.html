
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#e9f8ee">
<title>ADS GROWTH | Create Account</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

:root{
  --green:#39ad50;
  --dark:#111827;
  --muted:#8190a0;
  --border:#dfe7e5;
}

body{
  font-family:Arial,sans-serif;
  background:#e8f7ec;
  color:var(--dark);
  min-height:100vh;
  padding:25px 15px;
  background-image:
    radial-gradient(#bce8c7 1px,transparent 1px);
  background-size:18px 18px;
}

.page{
  max-width:630px;
  margin:auto;
  background:#fff;
  border-radius:38px;
  padding:42px 30px 35px;
  box-shadow:0 15px 50px rgba(27,93,47,.10);
}

.brand{
  display:flex;
  align-items:center;
  gap:22px;
  margin:0 15px 105px;
}

.brand-logo{
  width:85px;
  height:85px;
  border-radius:50%;
  background:white;
  border:7px solid #f2f8f3;
  box-shadow:0 8px 22px #00000012;
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--green);
  font-size:30px;
  font-weight:900;
}

.brand-text{
  font-size:34px;
  font-weight:1000;
  font-style:italic;
  line-height:1.35;
  letter-spacing:-1.5px;
}

.top-label{
  text-align:center;
  color:var(--green);
  font-size:14px;
  font-weight:900;
  letter-spacing:5px;
  margin-bottom:15px;
}

.heading{
  max-width:470px;
  margin:0 auto 55px;
}

.heading h1{
  font-size:39px;
  font-weight:1000;
  font-style:italic;
  line-height:1.35;
  letter-spacing:-1px;
  text-transform:uppercase;
}

.heading p{
  color:#778493;
  font-size:20px;
  margin-top:23px;
  line-height:1.5;
}

.form-group{
  margin-bottom:29px;
}

label{
  display:block;
  color:#344252;
  font-size:17px;
  font-weight:800;
  letter-spacing:1px;
  margin-bottom:15px;
}

.field{
  display:flex;
  align-items:center;
  border:1px solid var(--border);
  border-radius:24px;
  height:86px;
  padding:0 20px;
  box-shadow:0 3px 6px #00000008;
}

.field:focus-within{
  border:3px solid var(--green);
}

.field-icon{
  color:#9aa9b9;
  font-size:25px;
  width:48px;
  flex-shrink:0;
}

.field input{
  width:100%;
  border:0;
  outline:0;
  font-size:21px;
  color:#263445;
  min-width:0;
  background:transparent;
}

.field input::placeholder{
  color:#98a5b5;
}

.phone-row{
  display:grid;
  grid-template-columns:200px 1fr;
  gap:14px;
}

.country{
  height:86px;
  border:1px solid var(--border);
  border-radius:20px;
  background:white;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:12px;
  font-size:20px;
  color:#526172;
}

.country select{
  border:0;
  outline:0;
  font-size:17px;
  background:transparent;
  width:85px;
}

.password-field{
  display:flex;
  align-items:center;
  width:100%;
}

.password-field input{
  flex:1;
  min-width:0;
}

.show-btn{
  color:var(--green);
  background:none;
  border:0;
  font-size:18px;
  font-weight:bold;
  padding:8px;
}

.submit-btn{
  width:100%;
  height:82px;
  background:var(--green);
  color:white;
  border:0;
  border-radius:23px;
  font-size:22px;
  font-weight:900;
  margin-top:0;
  box-shadow:0 5px 12px #39ad5020;
}

.submit-btn:disabled{
  opacity:.6;
}

.signin{
  text-align:center;
  color:#778493;
  font-size:16px;
  margin-top:28px;
}

.signin button{
  background:none;
  border:0;
  color:var(--green);
  font-weight:900;
  font-size:16px;
}

.terms{
  text-align:center;
  font-size:12px;
  color:#87938d;
  line-height:1.7;
  margin-top:30px;
}

.message{
  display:none;
  margin-top:18px;
  padding:13px;
  border-radius:10px;
  font-size:14px;
  line-height:1.5;
}

.success{display:block;background:#e7f8ec;color:#087443}
.error{display:block;background:#fff0ef;color:#b42318}
.hidden{display:none!important}

@media(max-width:520px){
  body{padding:0;background:#e8f7ec}
  .page{
    border-radius:0 0 25px 25px;
    padding:32px 28px 35px;
  }
  .brand{
    margin:0 15px 105px;
    gap:18px;
  }
  .brand-logo{
    width:82px;
    height:82px;
  }
  .brand-text{font-size:31px}
  .heading{margin-bottom:52px}
  .heading h1{font-size:39px}
  .heading p{font-size:20px}
  .field{height:86px}
  .phone-row{grid-template-columns:42% 1fr;gap:12px}
  .country{height:86px;gap:5px}
  .country select{width:70px}
  .field input{font-size:19px}
  label{font-size:16px}
}

@media(max-width:370px){
  .page{padding-left:19px;padding-right:19px}
  .brand-text{font-size:27px}
  .heading h1{font-size:34px}
  .phone-row{grid-template-columns:40% 1fr}
}
</style>
</head>

<body>

<div class="page">

  <div class="top-label">WORKSPACE LOGIN</div>

  <div class="brand">
    <div class="brand-logo">AG</div>
    <div class="brand-text">
      ADS GROWTH
    </div>
  </div>

  <div id="registerScreen">

    <div class="heading">
      <h1>CREATE YOUR<br>ACCOUNT</h1>
      <p>Get started with your free account today</p>
    </div>

    <form id="registerForm">

      <div class="form-group">
        <label>BUSINESS NAME</label>
        <div class="field">
          <span class="field-icon">▦</span>
          <input id="businessName" type="text"
            placeholder="Your Company Name" required>
        </div>
      </div>

      <div class="form-group">
        <label>FULL NAME</label>
        <div class="field">
          <span class="field-icon">♙</span>
          <input id="fullName" type="text"
            placeholder="John Doe" required>
        </div>
      </div>

      <div class="form-group">
        <label>WORK EMAIL</label>
        <div class="field">
          <span class="field-icon">✉</span>
          <input id="registerEmail" type="email"
            placeholder="name@company.com" required>
        </div>
      </div>

      <div class="form-group">
        <label>PHONE NUMBER</label>
        <div class="phone-row">
          <div class="country">
            🇮🇳
            <select id="countryCode">
              <option value="+91">+91</option>
            </select>
          </div>
          <div class="field">
            <span class="field-icon">♧</span>
            <input id="registerPhone" type="tel"
              inputmode="numeric" maxlength="10"
              placeholder="10-digit mobile number" required>
          </div>
        </div>
      </div>

      <div class="form-group">
        <label>PASSWORD</label>
        <div class="field">
          <span class="field-icon">♙</span>
          <div class="password-field">
            <input id="registerPassword" type="password"
              minlength="8" placeholder="Create a strong password" required>
            <button class="show-btn" type="button"
              onclick="togglePassword('registerPassword',this)">Show</button>
          </div>
        </div>
      </div>

      <button class="submit-btn" id="registerBtn" type="submit">
        Create account →
      </button>

    </form>

    <div class="signin">
      Already have an account?
      <button type="button" onclick="showLogin()">Sign in</button>
    </div>

    <div id="authMessage" class="message"></div>

    <div class="terms">
      By creating an account, you agree to our
      Terms & Conditions and Privacy Policy.
    </div>

  </div>

  <!-- LOGIN SCREEN CONTINUES IN PART 2 -->
</div>
</body>
              </html>
