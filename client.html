<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080808">
<title>ADS GROWTH Client Dashboard</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080808;color:white;font-family:Arial,sans-serif}
header{padding:22px;text-align:center}
h1{color:#ff7900;font-size:32px}
.subtitle{color:#aaa;font-size:20px}
.container{max-width:750px;margin:auto;padding:20px}
.card{background:#171717;border:1px solid #383838;border-radius:18px;padding:24px;margin:18px 0}
input{width:100%;padding:17px;margin:12px 0 20px;background:#080808;color:white;border:1px solid #555;border-radius:12px;font-size:17px}
label{color:#bbb}
button{background:#ff7900;color:#111;border:0;border-radius:10px;padding:15px;font-weight:bold;font-size:16px;cursor:pointer;margin:5px}
.full{width:100%}
.hidden{display:none}
#message{color:#ff8181}
.item{border-bottom:1px solid #444;padding:15px 0;overflow-wrap:anywhere}
.key{background:#080808;padding:12px;border-radius:8px;overflow-wrap:anywhere}
.secondary{background:#333;color:white}
.danger{background:#b92d2d;color:white}
</style>
</head>
<body>

<header>
<h1>ADS GROWTH</h1>
<div class="subtitle">CLIENT API DASHBOARD</div>
</header>

<div class="container">

<div id="loginBox" class="card">
<h2>Client Login</h2>

<label>Email Address or Phone Number</label>
<input id="login" placeholder="Email or phone" autocomplete="username">

<label>Password</label>
<input id="password" type="password" placeholder="Password" autocomplete="current-password">

<button class="full" onclick="loginClient()">LOGIN</button>

<p id="message"></p>
<p style="color:#aaa">
Sirf approved clients login kar sakte hain. Login details admin se prapt karein.
</p>
</div>

<div id="dashboard" class="hidden">
<div class="card">
<h2>Welcome</h2>
<p id="customerName"></p>
<p id="customerEmail"></p>
<p id="customerStatus"></p>
<button onclick="logout()" class="danger">LOGOUT</button>
</div>

<div class="card">
<h2>API Management</h2>
<button class="full" onclick="generateApiKey()">GENERATE API KEY</button>
<button class="full secondary" onclick="loadKeys()">REFRESH API KEYS</button>
<div id="keyList"></div>
</div>
</div>
</div>

<script>
const API="https://ads-growth-whatsapp-api.onrender.com";
let token=localStorage.getItem("ads_client_token")||"";

async function api(path,method="GET",body=null){
  const response=await fetch(API+path,{
    method,
    headers:{
      "Content-Type":"application/json",
      "Authorization":"Bearer "+token
    },
    body:body?JSON.stringify(body):null
  });

  const data=await response.json();

  if(!response.ok||!data.success){
    throw new Error(data.message||"Request failed");
  }

  return data;
}

async function loginClient(){
  const login=document.getElementById("login").value.trim();
  const password=document.getElementById("password").value;
  const message=document.getElementById("message");

  if(!login||!password){
    message.textContent="Email/phone and password required.";
    return;
  }

  message.textContent="Logging in...";

  try{
    const response=await fetch(API+"/api/client/login",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({login,password})
    });

    const data=await response.json();

    if(!response.ok||!data.success){
      throw new Error(data.message||"Invalid login details.");
    }

    token=data.token;
    localStorage.setItem("ads_client_token",token);
    showDashboard(data.customer);

  }catch(error){
    message.textContent=error.message;
  }
}

function showDashboard(customer){
  document.getElementById("loginBox").classList.add("hidden");
  document.getElementById("dashboard").classList.remove("hidden");

  document.getElementById("customerName").textContent=
    "Name: "+(customer.name||"-");

  document.getElementById("customerEmail").textContent=
    "Email: "+(customer.email||"-");

  document.getElementById("customerStatus").textContent=
    "Status: "+(customer.status||"-");

  loadKeys();
}

async function loadProfile(){
  try{
    const data=await api("/api/client/me");
    showDashboard(data.customer);
  }catch(error){
    logout();
  }
}

async function generateApiKey(){
  if(!confirm("Generate a new API key?"))return;

  try{
    const data=await api("/api/client/api-key","POST");

    prompt(
      "Your new API key. Copy and save it safely:",
      data.api_key
    );

    loadKeys();

  }catch(error){
    alert(error.message);
  }
}
  async function loadKeys(){
  try{
    const data=await api("/api/client/api-keys");
    const box=document.getElementById("keyList");
    box.innerHTML="";

    if(!data.keys.length){
      box.textContent="No API keys generated yet.";
      return;
    }

    data.keys.forEach(key=>{
      const item=document.createElement("div");
      item.className="item";

      const title=document.createElement("p");
      title.textContent=
        key.key_prefix+" | "+key.status;

      item.appendChild(title);

      if(key.status==="active"){
        const reveal=document.createElement("button");
        reveal.textContent="REVEAL KEY";
        reveal.className="secondary";

        reveal.onclick=async()=>{
          try{
            const result=await api(
              "/api/client/api-keys/"+encodeURIComponent(key.id)+"/reveal"
            );

            prompt("Your API key:",result.api_key);

          }catch(error){
            alert(error.message);
          }
        };

        const revoke=document.createElement("button");
        revoke.textContent="REVOKE";
        revoke.className="danger";

        revoke.onclick=async()=>{
          if(!confirm("Are you sure you want to revoke this key?"))return;

          try{
            await api(
              "/api/client/api-keys/"+encodeURIComponent(key.id)+"/revoke",
              "POST"
            );

            alert("API key revoked.");
            loadKeys();

          }catch(error){
            alert(error.message);
          }
        };

        item.append(reveal,revoke);
      }

      box.appendChild(item);
    });

  }catch(error){
    document.getElementById("keyList").textContent=error.message;
  }
}

function logout(){
  localStorage.removeItem("ads_client_token");
  token="";
  location.reload();
}

if(token){
  loadProfile();
}
</script>

</body>
</html>
