<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ADS GROWTH Admin</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080808;color:#fff;font-family:Arial,sans-serif}
header{padding:18px;background:#151515;display:flex;align-items:center;gap:15px;border-bottom:1px solid #333}
button{border:0;padding:12px 16px;border-radius:8px;background:#ff7900;color:#111;font-weight:bold;cursor:pointer}
input{width:100%;padding:13px;margin:8px 0 16px;background:#090909;color:#fff;border:1px solid #555;border-radius:8px}
h1{color:#ff7900}
.container{max-width:1100px;margin:auto;padding:20px}
.card{background:#171717;border:1px solid #333;border-radius:12px;padding:18px;margin:15px 0}
.hidden{display:none}
.menu{display:none;background:#171717;padding:12px}
.menu button{margin:5px}
.item{border-bottom:1px solid #444;padding:15px 0;overflow-wrap:anywhere}
.small{background:#333;color:#fff;margin:4px}
.danger{background:#b92d2d;color:#fff}
.green{background:#178448;color:#fff}
#message{color:#ff9b44;overflow-wrap:anywhere}
</style>
</head>
<body>

<header>
<button onclick="toggleMenu()">☰</button>
<h2 style="color:#ff7900">ADS GROWTH ADMIN</h2>
</header>

<div id="menu" class="menu hidden">
<button onclick="showSection('dashboard')">Dashboard</button>
<button onclick="showSection('customers')">Customers</button>
<button onclick="showSection('payments')">Payments</button>
<button onclick="logout()">Logout</button>
</div>

<div class="container">

<div id="loginBox" class="card">
<h2>Admin Login</h2>
<input id="email" type="email" placeholder="Admin email">
<input id="password" type="password" placeholder="Password">
<button onclick="adminLogin()">LOGIN</button>
<p id="loginMessage"></p>
</div>

<div id="panel" class="hidden">
<h1>Dashboard</h1>
<p id="message"></p>

<section id="dashboard" class="card">
<h2>ADS GROWTH Dashboard</h2>
<button onclick="loadCustomers()">Refresh Customers</button>
<button onclick="loadPayments()">Refresh Payments</button>
</section>

<section id="customers" class="card hidden">
<h2>Customers</h2>
<div id="customerList"></div>
</section>

<section id="payments" class="card hidden">
<h2>Payments</h2>
<div id="paymentList"></div>
</section>
</div>
</div>

<script>
const API = "https://ads-growth-whatsapp-api.onrender.com";
let adminToken = localStorage.getItem("ads_admin_token") || "";

function toggleMenu(){
  document.getElementById("menu").classList.toggle("hidden");
}

function showSection(id){
  ["dashboard","customers","payments"].forEach(x=>{
    document.getElementById(x).classList.add("hidden");
  });
  document.getElementById(id).classList.remove("hidden");
  document.getElementById("menu").classList.add("hidden");
}

function message(text){
  document.getElementById("message").textContent = text;
}

async function request(path,method="GET",body=null){
  const response = await fetch(API+path,{
    method,
    headers:{
      "Content-Type":"application/json",
      "Authorization":"Bearer "+adminToken
    },
    body:body ? JSON.stringify(body) : null
  });

  const data = await response.json();

  if(!response.ok || !data.success){
    throw new Error(data.message || "Request failed");
  }

  return data;
}

async function adminLogin(){
  const email=document.getElementById("email").value.trim();
  const password=document.getElementById("password").value;

  document.getElementById("loginMessage").textContent="Logging in...";

  try{
    const response=await fetch(API+"/api/admin/login",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({email,password})
    });

    const data=await response.json();

    if(!response.ok || !data.success){
      throw new Error(data.message || "Login failed");
    }

    adminToken=data.token;
    localStorage.setItem("ads_admin_token",adminToken);
    openPanel();

  }catch(error){
    document.getElementById("loginMessage").textContent=error.message;
  }
}

function openPanel(){
  document.getElementById("loginBox").classList.add("hidden");
  document.getElementById("panel").classList.remove("hidden");
  loadCustomers();
  loadPayments();
}

function logout(){
  localStorage.removeItem("ads_admin_token");
  adminToken="";
  location.reload();
}

async function loadCustomers(){
  try{
    const data=await request("/api/admin/customers");
    const box=document.getElementById("customerList");
    box.innerHTML="";

    data.customers.forEach(customer=>{
      const item=document.createElement("div");
      item.className="item";

      const title=document.createElement("h3");
      title.textContent=customer.name || customer.email || customer.phone;

      const info=document.createElement("p");
      info.textContent=
        "Email: "+(customer.email||"-")+
        " | Phone: "+(customer.phone||"-")+
        " | Status: "+(customer.status||"-");

      item.append(title,info);

      const approve=document.createElement("button");
      approve.textContent="Approve";
      approve.className="green";
      approve.onclick=()=>customerAction(customer.id,"approve");

      const reject=document.createElement("button");
      reject.textContent="Reject";
      reject.className="danger";
      reject.onclick=()=>customerAction(customer.id,"reject");

      const reset=document.createElement("button");
      reset.textContent="RESET PASSWORD";
      reset.className="small";
      reset.onclick=()=>resetPassword(customer.id);

      const keys=document.createElement("button");
      keys.textContent="Generate API Key";
      keys.className="small";
      keys.onclick=()=>generateKey(customer.id);

      const list=document.createElement("button");
      list.textContent="View API Keys";
      list.className="small";
      list.onclick=()=>loadCustomerKeys(customer.id,item);

      item.append(approve,reject,reset,keys,list);
      box.appendChild(item);
    });

  }catch(error){
    message(error.message);
  }
}
  <script>
async function customerAction(id,action){
  try{
    const data=await request(
      "/api/admin/customers/"+encodeURIComponent(id)+"/"+action,
      "POST"
    );
    message(data.message);
    loadCustomers();
  }catch(error){
    message(error.message);
  }
}

async function resetPassword(id){
  if(!confirm("Is customer ka password reset karein?"))return;

  try{
    const data=await request(
      "/api/admin/customers/"+encodeURIComponent(id)+"/reset-password",
      "POST"
    );

    const password=data.temporary_password;

    prompt(
      "Naya temporary password. Isse copy karke client ko dein:",
      password
    );

    message("Password reset successful. Client ko naya password dein.");
  }catch(error){
    message(error.message);
  }
}

async function generateKey(id){
  try{
    const data=await request(
      "/api/admin/customers/"+encodeURIComponent(id)+"/api-key",
      "POST"
    );

    prompt("New API key. Copy karke safe rakhein:",data.api_key);
    message("API key generated.");
    loadCustomers();

  }catch(error){
    message(error.message);
  }
}

async function loadCustomerKeys(id,item){
  try{
    const data=await request(
      "/api/admin/customers/"+encodeURIComponent(id)+"/api-keys"
    );

    const box=document.createElement("div");
    box.className="card";
    box.textContent="API Keys: ";

    data.keys.forEach(key=>{
      const row=document.createElement("div");
      row.className="item";

      const label=document.createElement("p");
      label.textContent=
        key.key_prefix+" | "+key.status+" | "+key.created_at;

      row.appendChild(label);

      if(key.status==="active"){
        const reveal=document.createElement("button");
        reveal.textContent="Reveal";
        reveal.onclick=async()=>{
          try{
            const result=await request(
              "/api/admin/api-keys/"+encodeURIComponent(key.id)+"/reveal"
            );
            prompt("API key:",result.api_key);
          }catch(error){
            message(error.message);
          }
        };

        const revoke=document.createElement("button");
        revoke.textContent="Revoke";
        revoke.className="danger";
        revoke.onclick=async()=>{
          if(!confirm("Revoke this API key?"))return;
          try{
            await request(
              "/api/admin/api-keys/"+encodeURIComponent(key.id)+"/revoke",
              "POST"
            );
            message("API key revoked.");
            loadCustomerKeys(id,item);
          }catch(error){
            message(error.message);
          }
        };

        row.append(reveal,revoke);
      }

      box.appendChild(row);
    });

    const old=item.querySelector(".card");
    if(old)old.remove();
    item.appendChild(box);

  }catch(error){
    message(error.message);
  }
}

async function loadPayments(){
  try{
    const data=await request("/api/admin/payments");
    const box=document.getElementById("paymentList");
    box.innerHTML="";

    data.payments.forEach(payment=>{
      const item=document.createElement("div");
      item.className="item";

      const info=document.createElement("p");
      info.textContent=
        "UTR: "+payment.utr+
        " | Status: "+payment.status+
        " | Customer ID: "+payment.customer_id;

      item.appendChild(info);

      if(payment.screenshot_url){
        const link=document.createElement("a");
        link.href=payment.screenshot_url;
        link.target="_blank";
        link.rel="noopener";
        link.textContent="View Screenshot";
        link.style.color="#ff7900";
        item.appendChild(link);
      }

      const approve=document.createElement("button");
      approve.textContent="Approve Payment";
      approve.className="green";
      approve.onclick=async()=>{
        try{
          const result=await request(
            "/api/admin/payments/"+encodeURIComponent(payment.id)+"/approve",
            "POST"
          );
          message(result.message);
          loadPayments();
          loadCustomers();
        }catch(error){
          message(error.message);
        }
      };

      const reject=document.createElement("button");
      reject.textContent="Reject Payment";
      reject.className="danger";
      reject.onclick=async()=>{
        try{
          const result=await request(
            "/api/admin/payments/"+encodeURIComponent(payment.id)+"/reject",
            "POST"
          );
          message(result.message);
          loadPayments();
        }catch(error){
          message(error.message);
        }
      };

      item.append(approve,reject);
      box.appendChild(item);
    });

  }catch(error){
    message(error.message);
  }
}

if(adminToken){
  openPanel();
}
</script>

</body>
</html>
