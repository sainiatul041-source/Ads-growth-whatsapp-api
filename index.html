<script>
"use strict";

const API_URL = "https://ads-growth-whatsapp-api.onrender.com";

const $ = (id) => document.getElementById(id);

const prices = {
  Starter: 4999,
  Business: 7999,
  Enterprise: 9999
};

/* Safe HTML element helpers */
function setText(id, value) {
  const el = $(id);
  if (el) el.textContent = String(value ?? "");
}

function showBox(id, message) {
  const el = $(id);
  if (!el) {
    alert(message);
    return;
  }
  if (message !== undefined) el.textContent = message;
  el.style.display = "block";
}

function hideBox(id) {
  const el = $(id);
  if (!el) return;
  el.style.display = "none";
  el.textContent = "";
}

function selectPlan(plan) {
  const el = $("plan");
  if (el && prices[plan]) el.value = plan;
}

/* Read server response safely */
async function readResponse(response) {
  const text = await response.text();
  let data;

  try {
    data = JSON.parse(text);
  } catch {
    throw new Error(
      "Server returned an invalid response. Please check Render logs."
    );
  }

  if (!response.ok || !data.success) {
    throw new Error(data.message || "Request failed.");
  }

  return data;
}

/* Restore saved customer information */
(function restoreCustomer() {
  try {
    const saved = JSON.parse(
      localStorage.getItem("adsGrowthCustomer") || "null"
    );

    if (saved && saved.id && saved.phone) {
      if ($("payCustomerId")) $("payCustomerId").value = saved.id;
      if ($("payPhone")) $("payPhone").value = saved.phone;
    }
  } catch (error) {
    console.error("Restore error:", error);
  }
})();

/* Set current year */
setText("year", new Date().getFullYear());

/* CUSTOMER REGISTRATION */
const joinForm = $("joinForm");

if (joinForm) {
  joinForm.addEventListener("submit", async function(event) {
    event.preventDefault();

    hideBox("successBox");
    hideBox("errorBox");

    const name = $("name")?.value.trim() || "";
    const phone = $("phone")?.value.trim() || "";
    const email = $("email")?.value.trim() || "";
    const plan = $("plan")?.value || "";
    const message = $("message")?.value.trim() || "";

    const button = $("submitBtn");

    if (!name || !phone || !prices[plan]) {
      showBox("errorBox", "Please complete all required fields.");
      return;
    }

    if (!/^[0-9+\-\s]{10,15}$/.test(phone)) {
      showBox("errorBox", "Please enter a valid mobile number.");
      return;
    }

    if (!button) {
      alert("Registration button is missing in HTML.");
      return;
    }

    button.disabled = true;
    button.textContent = "PLEASE WAIT...";

    try {
      const response = await fetch(API_URL + "/api/register", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          full_name: name,
          phone: phone,
          email: email,
          plan: plan,
          amount: prices[plan],
          message: message
        })
      });

      const result = await readResponse(response);

      if (!result.customer || !result.customer.id) {
        throw new Error("Server did not return Customer ID.");
      }

      const customer = {
        id: result.customer.id,
        phone: phone
      };

      localStorage.setItem(
        "adsGrowthCustomer",
        JSON.stringify(customer)
      );

      setText("customerId", customer.id);

      if ($("payCustomerId")) {
        $("payCustomerId").value = customer.id;
      }

      if ($("payPhone")) {
        $("payPhone").value = phone;
      }

      showBox("successBox");

      if ($("successBox")) {
        $("successBox").scrollIntoView({
          behavior: "smooth",
          block: "center"
        });
      }

    } catch (error) {
      console.error("Registration error:", error);

      showBox(
        "errorBox",
        "Registration error: " + error.message
      );

    } finally {
      button.disabled = false;
      button.textContent = "SUBMIT REGISTRATION →";
    }
  });
}

/* PAYMENT SUBMISSION */
const payForm = $("payForm");

if (payForm) {
  payForm.addEventListener("submit", async function(event) {
    event.preventDefault();

    hideBox("paymentSuccess");
    hideBox("paymentError");

    const customerId = $("payCustomerId")?.value.trim() || "";
    const phone = $("payPhone")?.value.trim() || "";
    const utr = $("utr")?.value.trim() || "";
    const screenshot = $("screenshot")?.files?.[0];

    const button = $("paymentBtn");

    if (!customerId) {
      showBox("paymentError", "Please register first.");
      return;
    }

    if (!/^[0-9+\-\s]{10,15}$/.test(phone)) {
      showBox("paymentError", "Enter your registered mobile number.");
      return;
    }

    if (!/^[A-Za-z0-9]{6,30}$/.test(utr)) {
      showBox("paymentError", "Enter a valid UTR (6 to 30 characters).");
      return;
    }

    if (!screenshot) {
      showBox("paymentError", "Please select your payment screenshot.");
      return;
    }

    const allowed = [
      "image/jpeg",
      "image/png",
      "image/webp"
    ];

    if (!allowed.includes(screenshot.type)) {
      showBox("paymentError", "Only JPG, PNG and WEBP are allowed.");
      return;
    }

    if (screenshot.size > 5 * 1024 * 1024) {
      showBox("paymentError", "Screenshot must be below 5 MB.");
      return;
    }

    if (!button) {
      alert("Payment button is missing in HTML.");
      return;
    }

    button.disabled = true;
    button.textContent = "UPLOADING PAYMENT...";

    try {
      const formData = new FormData();

      formData.append("customer_id", customerId);
      formData.append("phone", phone);
      formData.append("utr", utr);
      formData.append("screenshot", screenshot);

      const response = await fetch(
        API_URL + "/api/payment-submit",
        {
          method: "POST",
          body: formData
        }
      );

      const result = await readResponse(response);

      setText(
        "paymentId",
        result.payment?.id || "Submitted"
      );

      setText(
        "paymentSuccessText",
        result.message || "Payment submitted for manual verification."
      );

      showBox("paymentSuccess");

      if ($("utr")) $("utr").value = "";
      if ($("screenshot")) $("screenshot").value = "";

      if ($("paymentSuccess")) {
        $("paymentSuccess").scrollIntoView({
          behavior: "smooth",
          block: "center"
        });
      }

    } catch (error) {
      console.error("Payment error:", error);

      showBox(
        "paymentError",
        "Payment submission error: " + error.message
      );

    } finally {
      button.disabled = false;
      button.textContent = "SUBMIT PAYMENT PROOF →";
    }
  });
}

 </script>
